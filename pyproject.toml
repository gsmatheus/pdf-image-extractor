[project]
name = "pdf-image-extractor"
version = "0.1.0"
description = "Extract the images embedded in a PDF and print the text of each page."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.8",
    "pillow>=12.0.0",
    "pymupdf>=1.26.6",
]

[project.scripts]
pdf-image-extractor = "pdf_image_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_image_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
